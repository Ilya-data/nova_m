version: 2

models:
  - name: dim_property
    description: >
      Conformed property dimension. One row per property, including
      properties with zero reservations -- other facts (e.g.
      fct_capacity_daily) need to join every property regardless of
      booking activity.
    columns:
      - name: property_id
        description: "Primary key."
        data_tests:
          - not_null
          - unique
      - name: property_name
        data_tests:
          - not_null
      - name: country
        data_tests:
          - not_null
      - name: city
        data_tests:
          - not_null
      - name: zip_code
      - name: property_type
        data_tests:
          - not_null
      - name: star_rating
        data_tests:
          - not_null
      - name: total_rooms
        data_tests:
          - not_null
      - name: seasonality
        data_tests:
          - not_null

  - name: dim_date
    description: >
      Conformed calendar dimension. One row per calendar day, spanning the
      full date range covered by int_property_capacity (the union of the
      reservation and maintenance date ranges).
    columns:
      - name: date_day
        description: "Primary key."
        data_tests:
          - not_null
          - unique
      - name: week_start_date
        description: "Monday of the ISO week containing date_day, calculated independently of Snowflake's WEEK_START session setting. Use this for weekly rollups."
        data_tests:
          - not_null
      - name: month_date
        data_tests:
          - not_null
      - name: year
        data_tests:
          - not_null
      - name: month
        data_tests:
          - not_null
      - name: month_name
        data_tests:
          - not_null
      - name: quarter
        data_tests:
          - not_null
      - name: day_of_month
        data_tests:
          - not_null
      - name: day_of_week
        data_tests:
          - not_null
      - name: is_weekend
        data_tests:
          - not_null

  - name: fct_reservation_nights
    description: >
      Confirmed reservations exploded to one row per stay night, plus one
      check-in-date row for each No_Show reservation representing Nova M's
      retained first-night charge; later no-show nights are released.
      Enriched beyond int_reservation_nights with arrival/departure flags, a
      peak-season flag (needs dim_property, so it's computed here), a friendly
      weekday/weekend label, and lead-time bucketing. Join to dim_property on
      property_id and dim_date on stay_date = date_day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - reservation_id
              - stay_date
    columns:
      - name: reservation_id
        data_tests:
          - not_null
      - name: stay_date
        data_tests:
          - not_null
      - name: property_id
        description: "Foreign key to dim_property."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_id
      - name: room_type_id
        data_tests:
          - not_null
      - name: channel_id
        data_tests:
          - not_null
      - name: nightly_revenue
        description: >
          Renamed from int_reservation_nights.nightly_rate and rounded to 2
          decimals. For Confirmed reservations, this is total_amount allocated
          evenly across nights -- additive (SUM gives the reservation's
          total_amount back), not a price/ADR metric that should be averaged.
          A No_Show has one row containing its retained first-night charge.
      - name: num_guests
      - name: num_nights
        description: "Total originally booked nights. No_Show reservations contribute one fact row despite this booked-night count."
        data_tests:
          - not_null
      - name: lead_time_days
        description: "Days between booking_date and check_in_date (not specific to this stay_date row)."
      - name: lead_time_bucket
        description: "lead_time_days bucketed for booking-pattern segmentation."
        data_tests:
          - accepted_values:
              arguments:
                values: ['0-7 days', '8-30 days', '31-90 days', '90+ days']
      - name: meal_plan
      - name: booking_channel
      - name: property_name
      - name: country
      - name: room_type_name
      - name: stay_month
        data_tests:
          - not_null
      - name: day_of_week
        data_tests:
          - not_null
      - name: is_weekend
        data_tests:
          - not_null
      - name: day_type
        description: "Friendly label for is_weekend: 'Weekend' or 'Weekday'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Weekend', 'Weekday']
      - name: is_arrival_night
        description: "True when stay_date is the first stay night of the reservation."
        data_tests:
          - not_null
      - name: is_departure_night
        description: "True when stay_date is the last stay night of the reservation."
        data_tests:
          - not_null
      - name: is_peak_season
        description: >
          True when the property is year-round (seasonality = 'All'), or
          when it's a seasonal (Apr-Oct) property and stay_date falls within
          that window.
        data_tests:
          - not_null
      - name: reservation_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['Confirmed', 'No_Show']

  - name: fct_capacity_daily
    description: >
      Daily available room capacity per property x room_type, net of
      maintenance blocks, enriched beyond int_property_capacity. Kept at
      daily grain (not pre-aggregated) so weekly and monthly capacity
      analysis are both possible -- roll up in Tableau via dim_date's
      week_start_date / month_date, not in this model. Join to dim_property
      on property_id and dim_date on capacity_date = date_day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - property_id
              - room_type_id
              - capacity_date
    columns:
      - name: property_id
        description: "Foreign key to dim_property."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_id
      - name: property_name
      - name: country
      - name: room_type_id
        data_tests:
          - not_null
      - name: room_type_name
      - name: capacity_date
        description: "Foreign key to dim_date."
        data_tests:
          - not_null
      - name: room_count
        description: "Total physical rooms of this type at this property."
        data_tests:
          - not_null
      - name: rooms_blocked
        description: "Rooms blocked by maintenance on this date. 0 when no block applies."
        data_tests:
          - not_null
      - name: available_rooms
        description: "room_count minus rooms_blocked. Denominator for occupancy rate / RevPAR."
        data_tests:
          - not_null
      - name: pct_rooms_blocked
        description: "rooms_blocked / room_count. NULL (not 0) when room_count is 0, via dbt_utils.safe_divide."
      - name: day_of_week
        data_tests:
          - not_null
      - name: is_weekend
        data_tests:
          - not_null
      - name: day_type
        description: "Friendly label for is_weekend: 'Weekend' or 'Weekday'."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Weekend', 'Weekday']
      - name: is_peak_season
        description: >
          True when the property is year-round (seasonality = 'All'), or
          when it's a seasonal (Apr-Oct) property and capacity_date falls
          within that window. Same logic as fct_reservation_nights.
        data_tests:
          - not_null

  - name: fct_cancellations
    description: >
      Cancelled reservations only, at reservation grain, sourced directly
      from stg_reservations (bypasses the intermediate layer). Computing
      cancellation_rate requires a total-reservations count from elsewhere
      (e.g. combined with fct_reservation_nights' non-cancelled reservation
      count).
    columns:
      - name: reservation_id
        description: "Primary key."
        data_tests:
          - not_null
          - unique
      - name: property_id
        description: "Foreign key to dim_property."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_property')
                field: property_id
      - name: property_name
      - name: country
      - name: room_type_id
        data_tests:
          - not_null
      - name: room_type_name
      - name: channel_id
        data_tests:
          - not_null
      - name: booking_channel
      - name: booking_date
        data_tests:
          - not_null
      - name: check_in_date
        data_tests:
          - not_null
      - name: check_out_date
        data_tests:
          - not_null
      - name: cancellation_date
        description: "Date the reservation was cancelled."
        data_tests:
          - not_null
      - name: lead_time_days
      - name: cancellation_policy
      - name: cancellation_deadline_days
      - name: status
        description: "Always Cancelled in this mart."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Cancelled']
      - name: total_amount
        description: "Reservation revenue that was cancelled (lost revenue)."
        data_tests:
          - not_null
